[project]
name = "cn-textbook-downloader"
version = "0.1.0"
description = "命令行工具：从 GitHub 下载 ChinaTextbook 教材仓库，支持断点续传、校验与 PDF 分块合并"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "textual>=0.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cn-textbook = "cn_textbook_downloader.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cn_textbook_downloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
